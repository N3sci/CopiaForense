name: Build and Release Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows (Intel/AMD) - Funziona anche su ARM tramite emulatore nativo
          - os: windows-latest
            executable_name: CopiaForense.exe
            asset_name: CopiaForense-windows-x64
          # Linux (Intel/AMD)
          - os: ubuntu-22.04
            executable_name: CopiaForense
            asset_name: CopiaForense-linux-x64
          # Linux (ARM64 / Apple Silicon)
          - os: ubuntu-24.04-arm
            executable_name: CopiaForense
            asset_name: CopiaForense-linux-arm64
          # macOS (Intel)
          - os: macos-13
            executable_name: CopiaForense
            asset_name: CopiaForense-macos-intel
          # macOS (Apple Silicon M1/M2/M3)
          - os: macos-14
            executable_name: CopiaForense
            asset_name: CopiaForense-macos-silicon

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: pyinstaller --onefile --name CopiaForense main.py

    - name: Rename and Zip (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        mv dist/${{ matrix.executable_name }} dist/${{ matrix.asset_name }}
        cd dist && zip ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

    - name: Rename and Zip (Windows)
      if: runner.os == 'Windows'
      run: |
        move dist\${{ matrix.executable_name }} dist\${{ matrix.asset_name }}.exe
        cd dist
        Compress-Archive -Path ${{ matrix.asset_name }}.exe -DestinationPath ${{ matrix.asset_name }}.zip

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
