name: Build and Release Executables

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            executable_name: CopiaForense
            asset_name: CopiaForense-linux
          - os: windows-latest
            executable_name: CopiaForense.exe
            asset_name: CopiaForense-windows.exe
          - os: macos-latest
            executable_name: CopiaForense
            asset_name: CopiaForense-macos

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: pyinstaller --onefile --name CopiaForense main.py

    - name: Rename and zip executable (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        mv dist/${{ matrix.executable_name }} dist/${{ matrix.asset_name }}
        cd dist && zip ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

    - name: Rename executable (Windows)
      if: runner.os == 'Windows'
      run: move dist\${{ matrix.executable_name }} dist\${{ matrix.asset_name }}

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: false
        files: |
          dist/${{ matrix.asset_name }}.zip
          dist/${{ matrix.asset_name }}
